# Containerized version of run_local.sh: the shadow serves TLS on :8001
# directly on your LAN. The robot connects straight to this box (command 405
# points her here). No tunnel, no cloud -- nothing leaves the house.
#
#   sudo docker compose up -d --build
#   sudo docker compose logs -f shim
#
# Then point Loona at this box's LAN IP (see tools/loona_shadow_point.py).
services:
  shim:
    build: .
    container_name: loona-shadow
    restart: unless-stopped
    environment:
      - PORT=8001
      - TLS=1
      - DATA_DIR=/app/data
    volumes:
      - ./shim/data:/app/data
    ports:
      - "8001:8001"


