# cloudflared runs IN Docker here so it shares the compose network with the
# shim and can resolve the dashboard route http://shim:8080. (The native
# systemd cloudflared service is disabled to avoid two connectors on one token.)
services:
  shim:
    build: .
    container_name: loona-shadow
    restart: unless-stopped
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
    volumes:
      - ./shim/data:/app/data
    ports:
      - "127.0.0.1:8443:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: loona-shadow-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - shim


